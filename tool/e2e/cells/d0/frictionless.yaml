# The 3-D Secure fingerprint view runs hidden and the issuer authenticates without a challenge.
id: frictionless
platforms: [android, ios]
card:
  pan: "4111111111153063"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    threeds:
      outcome: authenticated
      flow: frictionless
      liability_shifted: true
