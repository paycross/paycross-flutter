# The sheet re-arms on a retryable failure, so Dart gets no result until the shopper acts.
# The rearmed check needs the merchant state below: the banner is the same after any submit failure.
id: challenge_authentication_failed_rearm
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:authentication_failed
  - expect rearmed
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_recovery: change_method
    threeds:
      outcome: not_authenticated
      flow: challenge
      liability_shifted: false
