# The sandbox ACS page picks the outcome by the button tapped, not by the PAN.
id: challenge_approve
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:approve
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    threeds:
      outcome: authenticated
      flow: challenge
      liability_shifted: true
