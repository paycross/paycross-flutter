# On iOS the driver taps the challenge view's Cancel item, which exists from PayCross 0.1.1.
# On Android the back key raises the same dialog from either screen.
id: cancel_mid_challenge
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - cancel_challenge
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 1
    txn_status: threeds_challenge_requested
    no_succeeded_txn: true
