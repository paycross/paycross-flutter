# The server has expired the session while the token is still valid. Neither SDK detects this at present time,
# so the payment form stays payable on both platforms after present_token.
# A decline first gives the session a failed transaction, so <txn> is non-empty and differs from session_expired_jwt.
# wait_expired polls the merchant API, which re-mints the token on every open-session GET. The last read before
# expiry keeps the token valid for about 900 s, so the cell measures the server's verdict, not JWT expiry.
# The label is the cancel result; expect no_result passes only if no label appears after re-presenting.
# Expected duration is about 30 minutes; the budget is a hang backstop, not a prediction.
id: session_expired_server
platforms: [android, ios]
card:
  pan: "4111111111150002"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect rearmed
  - cancel_form
  - wait_result 120
  - wait_expired 1400
  - relaunch
  - present_token
  - expect no_result
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: expired
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
