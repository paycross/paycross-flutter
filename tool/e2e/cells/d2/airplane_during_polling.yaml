# Asserts a known Android SDK bug: the label is retry although the payment succeeded.
# It turns red when the SDK is fixed; re-pin the label then.
# acs:approve returns before the provider authorizes, so airplane on can race the authorization.
id: airplane_during_polling
platforms: [android]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:approve
  - airplane on
  - wait_result 600
  - airplane off
expected:
  label: "result:failure:retry:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    no_succeeded_txn: false
