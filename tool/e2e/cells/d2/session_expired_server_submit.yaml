# The shopper pays into a session the server has already expired. The payment form stays payable after present_token on both platforms.
# The card is the approve PAN: a decline PAN would hide an authorization that got through, so no_succeeded_txn has teeth.
# No decline set-up before the wait: a successful payment completes the session, and a completed session never expires.
# wait_expired keeps the token valid while the session expires, as in session_expired_server.
# A clean result:failure:restart: or a re-arm with a banner is correct. A hang, a crash or result:failure:retry: is a finding.
# result:success: is a serious finding.
# txn_count is not asserted: whether a submit on a dead session creates a transaction is what is measured.
id: session_expired_server_submit
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - wait_expired 1400
  - relaunch
  - present_token
  - type_card
  - tap_pay
  - wait_result 90
expected:
  label: "<any>"
  merchant:
    session_status: expired
    no_succeeded_txn: true
