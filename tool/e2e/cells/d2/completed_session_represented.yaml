# A completed session resumes its original transaction; txn_count 1 is the double-charge check.
# no_succeeded_txn is false: the session must hold a transaction that moved money.
id: completed_session_represented
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - wait_result 180
  - relaunch
  - present_token
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    no_succeeded_txn: false
