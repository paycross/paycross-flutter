# The provider never answers: the sandbox timeout errors before publishing any event, so nothing reaches the SDK
# except the server's stuck-transaction sweep, which marks the transaction failed.
# The Dart side resolves on the SDK's own 480 s poll deadline on both platforms, so wait_result 600 clears it.
# The transaction's failure is null: the server writes failure_reason where the reader expects error,
# so failure_recovery is not asserted.
# txn_status is not asserted: the transaction may still be processing when the session is read.
id: timeout_provider_never_answers
platforms: [android, ios]
card:
  pan: "4111111111150051"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - wait_result 600
expected:
  label: "result:failure:retry:<txn>"
  merchant:
    session_status: open
    txn_count: 1
    no_succeeded_txn: true
