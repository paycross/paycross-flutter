# An expired card, reached through the ACS page rather than through a PAN.
#
# `declined_expired.json` (PAN ...0069) no longer declines: payment-sandbox
# 66db130 removed its magic entry, so it falls through DefaultOutcome and
# APPROVES. That is filed as a template/sandbox issue; the coverage stays
# here, on the challenge card, where card_expired is one of the ISSUER
# DECLINES buttons. The button's text is the outcome token verbatim
# (`internal/challenge/render.go`'s issuerOutcomes -- there is no
# internal/acs/), which is what `acs:<outcome>` taps.
#
# Retryable -- change_method -- so the sheet re-arms rather than resolving,
# the same shape as the two PAN-driven change_method cells beside it.
#
# No threeds assertion: this is an authorization decline that follows a
# successful authentication, and what the sandbox records in threeds_result
# for that pairing has never been measured. The run records it; Phase 3 pins
# it if it proves stable.
id: acs_card_expired
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:card_expired
  - expect rearmed
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_code: card_expired
    failure_recovery: change_method
    network_decline_code: "54"
