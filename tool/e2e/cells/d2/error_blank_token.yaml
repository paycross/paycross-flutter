# Both plugins reject a blank token natively, before the not-configured guard.
# The field is empty on a cold start; txn_count 0 shows the SDK refused before the backend was called.
id: error_blank_token
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - tap_example_pay
  - wait_result 60
expected:
  label: "error:invalidToken"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
