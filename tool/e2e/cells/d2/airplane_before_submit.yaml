# Android only: the iOS simulator shares the host network and has no airplane mode.
# The network is restored before cancel_form: airplane mode would fail every later cell.
id: airplane_before_submit
platforms: [android]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - airplane on
  - tap_pay
  - expect rearmed
  - airplane off
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
