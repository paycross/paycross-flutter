# The ACS button is the only route to this decline: the PAN-driven card approves in the sandbox.
# threeds is not asserted: the sandbox's threeds_result for this pairing is unverified.
id: acs_invalid_cvv
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:invalid_cvv
  - expect rearmed
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_code: invalid_cvv
    failure_recovery: change_method
    # CVV failures have no ISO 8583 decline code, so network_decline_code must be absent (null).
    network_decline_code: null
