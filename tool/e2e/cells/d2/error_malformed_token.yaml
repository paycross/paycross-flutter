# A non-blank token that is not a JWT. invalidToken is only for blank tokens, so both platforms
# end in result:failure:restart: with no transaction and no sheet.
# The label has no <txn> placeholder: a placeholder would accept a transaction id.
# The literal is capped at 200 printable characters by cells.py, so a live token cannot be committed here.
id: error_malformed_token
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - enter_token:not-a-real-session-token
  - tap_example_pay
  - wait_result 60
expected:
  label: "result:failure:restart:"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
