# txn_count is asserted to be 0: an abandoned form must never create a transaction.
id: cancel_on_form
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
