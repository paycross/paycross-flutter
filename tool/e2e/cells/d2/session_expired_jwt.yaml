# The token is past its exp while the session is still open: the JWT expires at 900 s, the session at 1200 s
# (payments.session_ttl and session_grace_period on the server). Re-read that config if this cell starts timing out.
# iOS checks expiry before presenting, so no sheet appears: present_token is used instead of paste_token.
# The label has no <txn> placeholder: this session holds no transaction, which tells it apart from session_expired_server.
# session_status is not asserted: the read may land on either side of the 1200 s expiry.
id: session_expired_jwt
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - wait 960
  - present_token
  - wait_result 90
expected:
  label: "result:failure:restart:"
  merchant:
    txn_count: 0
    no_succeeded_txn: true
