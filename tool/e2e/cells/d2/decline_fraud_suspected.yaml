# Android maps unknown recovery tokens to do_not_retry, so failure_recovery below is the real check.
id: decline_fraud_suspected
platforms: [android, ios]
card:
  pan: "4111111111150119"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - wait_result 180
expected:
  label: "result:failure:do_not_retry:<txn>"
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_code: fraud_suspected
    failure_recovery: do_not_retry
    network_decline_code: "59"
