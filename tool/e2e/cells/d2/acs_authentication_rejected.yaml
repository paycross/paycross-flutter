# threeds.outcome is not asserted: the sandbox's token for a rejection is unverified.
# network_decline_code is not asserted: an authentication outcome never reaches an issuer.
id: acs_authentication_rejected
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:authentication_rejected
  - wait_result 180
expected:
  label: "result:failure:do_not_retry:<txn>"
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_recovery: do_not_retry
    threeds:
      flow: challenge
      liability_shifted: false
