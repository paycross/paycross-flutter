# Sandbox outcome for PAN suffix 9995: insufficient funds. No 3DS is involved, so no threeds_result is asserted.
# Visa, so no network_advice_code: the server attaches a Merchant Advice Code only in a Mastercard range.
id: decline_insufficient_funds
platforms: [android, ios]
card:
  pan: "4111111111159995"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect rearmed
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_code: insufficient_funds
    failure_recovery: change_method
    network_decline_code: "51"
