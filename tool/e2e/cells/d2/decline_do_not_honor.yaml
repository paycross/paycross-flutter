# No network_advice_code is asserted: the server sends the Merchant Advice Code only for Mastercard.
id: decline_do_not_honor
platforms: [android, ios]
card:
  pan: "4111111111150002"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect rearmed
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  rearmed: true
  merchant:
    session_status: open
    txn_count: 1
    txn_status: failed
    no_succeeded_txn: true
    failure_code: do_not_honor
    failure_recovery: change_method
    network_decline_code: "05"
