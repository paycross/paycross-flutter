# Android only: the iOS simulator shares the host network, and cutting it needs sudo or the GUI.
# txn_status is not asserted: the stuck-transaction recovery may already have swept the row.
# The retry label is a measurement here, not the finding airplane_during_polling carries.
id: airplane_during_challenge
platforms: [android]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect acs
  - airplane on
  - wait_result 600
  - airplane off
expected:
  label: "result:failure:retry:<txn>"
  merchant:
    session_status: open
    txn_count: 1
    no_succeeded_txn: true
