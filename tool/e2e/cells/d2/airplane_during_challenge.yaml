# The network goes while the bank's challenge page is on screen, and does not
# come back. Nothing can complete: the ACS page cannot post its result and the
# SDK cannot poll. `expect acs` waits for the page without answering it, which
# is the only reason that expectation exists.
#
# The transaction sits at threeds_challenge_requested and must never become an
# authorization -- the same assertion cancel_mid_challenge makes, reached a
# different way. txn_status is left unasserted because the row may or may not
# have been swept by core's stuck-transaction recovery by the time the runner
# reads the session; no_succeeded_txn is the half that carries the finding.
#
# <any> because what the SDK eventually tells Dart after a challenge it can
# neither finish nor abandon has never been measured on either platform. The
# cell records it; Phase 3 pins it.
id: airplane_during_challenge
platforms: [android]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect acs
  - airplane on
  - wait_result 600
  - airplane off
expected:
  label: "<any>"
  merchant:
    session_status: open
    txn_count: 1
    no_succeeded_txn: true
