# Backgrounds for 60 s while the SDK polls, after the challenge is approved. The poll may finish during the
# background window; exactly one result must arrive either way, and it must match the merchant.
# On iOS the poll deadline runs on a ContinuousClock, so background time counts against the 480 s poll deadline.
# A background longer than 480 s would hit the deadline and is not covered here.
id: background_during_polling
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - acs:approve
  - background 60
  - wait_result 300
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
