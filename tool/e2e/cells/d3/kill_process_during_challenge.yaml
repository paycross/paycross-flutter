# The process dies with the sheet up, and the shopper relaunches. No result is delivered: the pending Dart call dies
# with the isolate. The transaction must never become an authorization.
# Killed during the challenge, not the submit, which is a race.
# kill_activity ends the process: am force-stop on Android, since am kill skips a foreground process.
# On iOS the app comes back with no result and the session still open at threeds_challenge_requested. A merchant
# that is killed mid-challenge never learns the outcome; reconciliation is server-side.
# Discovery cell: records what the platform does; no fixed label.
id: kill_process_during_challenge
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect acs
  - kill_activity
  - relaunch
  - expect no_result
expected:
  label: "<none>"
  merchant:
    session_status: open
    txn_count: 1
    no_succeeded_txn: true
