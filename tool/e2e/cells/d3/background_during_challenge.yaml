# Backgrounds for 60 s during a bank challenge, then approves it. Exactly one result, and a merchant state that matches what the shopper saw.
# expect acs waits for the challenge page without answering it, so the background lands with the page up.
# background resumes the existing task. On iOS it uses apps/activate: a launch would terminate the app and drop the console capture.
id: background_during_challenge
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - expect acs
  - background 60
  - acs:approve
  - wait_result 240
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
