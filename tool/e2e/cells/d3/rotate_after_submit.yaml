# A quarter turn with the sheet up after submitting, and back again. This exercises the SDK's own recreation:
# PaymentActivity declares no configChanges, so a rotation destroys and recreates it.
# Rotate after the submit, not on the form: the CVV field is plain remember, by design, so a turn on the form clears it.
# Rotate twice: orientation outlives the cell, so an odd count leaves the next cell's buttons off screen. The drivers refuse a turned device.
# Android only: on iOS a rotation with the sheet up leaves the CVV keypad undismissable on the challenge page, so acs() cannot answer it.
id: rotate_after_submit
platforms: [android]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - type_card
  - tap_pay
  - rotate
  - rotate
  - acs:approve
  - wait_result 240
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
