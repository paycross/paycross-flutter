# Pays with a fresh card and stores it. save_card_config renders the checkbox and customer.merchant_reference
# is required: without the reference the card is stored against a random customer.
# The reference is a literal: storing the same PAN again returns already_existing, so the customer holds one card.
# Filename order is execution order: the saved-card list is snapshotted when a session is created, so
# saved_card_2_pay must mint its session after this save settles.
id: saved_card_1_save
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    save_card_config:
      usage: card_on_file
    customer:
      merchant_reference: "CUST-E2E-D5-INSTANT"
# save_card runs before type_card. Typing ends with the CVV, whose numeric pad covers the bottom of the iOS sheet
# and cannot be dismissed, so the save toggle below the fold is unreachable after typing.
# The control is composed from the session, so it is on screen before any digit is typed.
actions:
  - paste_token
  - save_card
  - type_card
  - tap_pay
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    saved_card_saved: true
