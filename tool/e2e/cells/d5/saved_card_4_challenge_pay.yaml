# Pays again with the stored challenge card, re-entering the CVV. A saved-card submit carries card.saved_uuid rather
# than a PAN, and the sandbox routes on the PAN's last four digits, so the SDK must drive a 3DS round trip on re-use.
# acs:approve and the threeds block assert rather than discover: a stored credential that stops challenging fails the ACS wait,
# since a silent frictionless re-use would be a liability-shift regression.
id: saved_card_4_challenge_pay
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    saved_cards:
      show: all
    customer:
      merchant_reference: "CUST-E2E-D5-CHALLENGE"
actions:
  - paste_token
  - expect saved_card
  - select_saved_card
  - type_cvv
  - tap_pay
  - acs:approve
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    saved_card_used: true
    threeds:
      outcome: authenticated
      flow: challenge
      liability_shifted: true
