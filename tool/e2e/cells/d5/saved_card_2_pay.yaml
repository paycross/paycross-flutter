# Pays again with the card the previous cell stored, re-entering the CVV.
# saved_cards show: all is required: without it the session snapshot carries no cards. Expired cards are
# filtered there and re-checked at submit, so the stored card's expiry must stay valid.
# Neither SDK auto-selects a stored card, so the selection is an explicit action.
# The card block is required by the loader, but the PAN is not typed here: type_cvv reads only card.cvv.
id: saved_card_2_pay
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    saved_cards:
      show: all
    customer:
      merchant_reference: "CUST-E2E-D5-INSTANT"
actions:
  - paste_token
  - expect saved_card
  - select_saved_card
  - type_cvv
  - tap_pay
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    saved_card_used: true
