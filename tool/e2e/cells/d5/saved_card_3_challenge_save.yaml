# The same store, on the card that raises a 3-D Secure challenge. A second customer means each selector offers exactly one row.
# A submit that goes through an authentication round trip is a different path from one that does not, so the save is checked on both.
id: saved_card_3_challenge_save
platforms: [android, ios]
card:
  pan: "4111111111153220"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    save_card_config:
      usage: card_on_file
    customer:
      merchant_reference: "CUST-E2E-D5-CHALLENGE"
# save_card runs before type_card. Typing ends with the CVV, whose numeric pad covers the bottom of the iOS sheet
# and cannot be dismissed, so the save toggle below the fold is unreachable after typing.
# The control is composed from the session, so it is on screen before any digit is typed.
actions:
  - paste_token
  - save_card
  - type_card
  - tap_pay
  - acs:approve
  - wait_result 180
expected:
  label: "result:success:<txn>"
  merchant:
    session_status: completed
    txn_count: 1
    txn_status: succeeded
    saved_card_saved: true
    threeds:
      outcome: authenticated
      flow: challenge
      liability_shifted: true
