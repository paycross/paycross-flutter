# The shopper deletes a stored card, and it stays deleted. Runs last in this directory: it removes the card that
# saved_card_1_save stores and saved_card_2_pay charges. Re-saving a removed PAN returns the same saved-card uuid,
# so saved_card_1_save restores the card on the next run.
# allow_removal renders the bin. preselect is not used: it opens the sheet on a card with no number field.
# The removal is proven by the row's own identifier leaving the sheet: a Confirm tap alone is not enough,
# since a failed write leaves the row in place with an error banner.
# txn_count 0 is the real assertion of the tail: a session that gained a transaction from a removal is a finding.
id: saved_card_5_remove
platforms: [android, ios]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    saved_cards:
      show: all
      allow_removal: true
    customer:
      merchant_reference: "CUST-E2E-D5-INSTANT"
actions:
  - paste_token
  - expect saved_card
  - remove_saved_card
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
