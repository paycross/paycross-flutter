# The wallet is offered. Two gates have to pass for the button to render:
# GooglePayRequests.isSessionEligible -- `wallets.google_pay != false &&
# account_funding != true` -- and an asynchronous isReadyToPay against Play
# services. This cell proves both do, on the default session, which is the
# precondition for every other D4 cell.
#
# The button is matched on `Pay with GPay`, which is Play services' own
# content-desc and not the SDK's: the SDK tags its button with
# Modifier.testTag, and testTagsAsResourceId is set nowhere in either repo, so
# that tag is invisible to uiautomator. Filed upstream; until it lands the
# handle belongs to Google and moves with the GMS version and the locale.
#
# It leaves by cancelling: a wallet payment is a separate cell, and this one
# must not spend one.
id: google_pay_offered
platforms: [android]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - expect google_pay
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
