# The wallet is offered on the default session. The button needs both the eligibility check and an asynchronous
# isReadyToPay against Play services to pass.
# The button is matched on Play services' content-desc "Pay with GPay". The SDK's test tag is invisible to
# uiautomator, because testTagsAsResourceId is not set, so the handle moves with the GMS version and locale.
# Cancels rather than paying: a wallet payment is a separate cell.
id: google_pay_offered
platforms: [android]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
actions:
  - paste_token
  - expect google_pay
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
