# The wallet is not offered on an account-funding session. Only the test merchant's aft attribute makes the
# checkout snapshot report data.account_funding true; without it the wallet stays offered and this cell fails.
# The suppression key is account_funding, not a wallets flag: only an explicit true suppresses the wallet.
# The absence is waited out, not looked for once: readiness is asynchronous, so one look could pass on a button that is merely late.
id: google_pay_absent_on_aft
platforms: [android]
card:
  pan: "4111111111170000"
  expiry: "12/28"
  cvv: "123"
session:
  amount: 1000
  currency: EUR
  options:
    account_funding:
      sender_is_recipient: true
      recipient:
        first_name: John
        last_name: Doe
        country: US
        entity_type: individual
actions:
  - paste_token
  - expect no_google_pay
  - cancel_form
  - wait_result 120
expected:
  label: "result:cancelled"
  merchant:
    session_status: open
    txn_count: 0
    no_succeeded_txn: true
