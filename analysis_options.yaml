# The `analyzer.exclude` block below is not hand-written: `flutter pub get`
# adds it, and a checkout without it is dirty the moment anyone runs one.
# Committed in the exact shape the tool writes so the tree stays clean.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
