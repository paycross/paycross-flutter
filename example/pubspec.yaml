name: paycross_demo
description: "PayCross Demo: mint sandbox sessions and run payment scenarios against the paycross_flutter plugin."
version: 0.1.15+1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  paycross_flutter:
    # When depending on this package from a real application you should use:
    #   paycross_flutter: ^x.y.z
    path: ../

  cupertino_icons: ^1.0.8

  package_info_plus: ^10.2.1

  http: ^1.6.0

  flutter_secure_storage: ^11.0.0

  shared_preferences: ^2.5.5

  app_links: ^7.2.1

  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
