name: Demo release

# Nothing else in this repo fires on tags, so demo-v* collides with nothing.
# ci.yml triggers on push-to-main and pull_request only.
on:
  push:
    tags: ['demo-v*']

permissions:
  contents: write

jobs:
  android:
    name: Signed APK and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout defaults to fetch-depth: 1, and on a shallow
          # clone `git rev-list --count` returns 1 -- forever, for every
          # tag. That would give versionCode 1 on every release and make the
          # APK and the IPA of one tag disagree.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      # example/android/app/build.gradle.kts pins
      # `compileSdk = maxOf(flutter.compileSdkVersion, 37)` because
      # flutter_secure_storage 11 declares 37 and its AAR metadata check
      # refuses anything lower. The hosted image does not necessarily carry a
      # platform that new, and the only place that would surface is a tag push
      # -- an owner action, and not a repeatable one.
      - name: Ensure the Android 37 platform is installed
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if "$SDKMANAGER" --list_installed | grep -q 'platforms;android-37'; then
            echo "platforms;android-37 already installed"
          else
            "$SDKMANAGER" --install 'platforms;android-37'
          fi

      - name: Restore the demo upload keystore
        env:
          DEMO_KEYSTORE_BASE64: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$DEMO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/demo-upload.p12"
          chmod 600 "$RUNNER_TEMP/demo-upload.p12"

      - name: Build the signed APK
        working-directory: example
        env:
          DEMO_KEYSTORE_FILE: ${{ runner.temp }}/demo-upload.p12
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
          DEMO_KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          DEMO_KEY_PASSWORD: ${{ secrets.DEMO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release \
            --build-name "${GITHUB_REF_NAME#demo-v}" \
            --build-number "$(git rev-list --count "$GITHUB_REF_NAME")"

      - name: Verify the certificate before anything is published
        env:
          DEMO_KEYSTORE_SHA256: ${{ vars.DEMO_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail
          # An unset repository variable expands to the empty string, so it IS
          # set and `set -u` does not fire -- and `grep -qF ""` then matches
          # any non-empty file. Check the length first, or the gate is a no-op
          # exactly when its input is missing.
          test "${#DEMO_KEYSTORE_SHA256}" -eq 64
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          # A debug-signed APK installs and runs and passes everything else,
          # then refuses to upgrade in place later. Fail here, not there.
          grep -qF "$DEMO_KEYSTORE_SHA256" certs.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=example/build/app/outputs/flutter-apk/app-release.apk
          cp "$APK" "paycross-demo-${GITHUB_REF_NAME}.apk"
          {
            echo "PayCross Demo ${GITHUB_REF_NAME#demo-v}"
            echo
            echo "Internal QA build. Starts in Test on every launch, against the"
            echo "TEST sandbox. Live mode reaches production with credentials you"
            echo "type in; every Live run charges a real card. Read the Live mode"
            echo "section of example/README.md before switching."
            echo
            echo "Install with \`adb install -r paycross-demo-${GITHUB_REF_NAME}.apk\`."
            echo "See example/README.md for the credentials, the scenarios and"
            echo "the test-card cheat sheet — including the three PANs not to use."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "paycross-demo-${GITHUB_REF_NAME}.apk" \
            --title "PayCross Demo ${GITHUB_REF_NAME#demo-v}" \
            --notes-file notes.md
