name: Sync the changelog to the developer portal

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Mirror CHANGELOG.md into api-docs
    runs-on: ubuntu-latest
    steps:
      # The two secrets exist on paycross-core and not yet on this repository.
      # Failing here says which ones are missing, rather than letting the token
      # step fail on a generic message or the sync push nothing at all.
      - name: Require the sync credentials
        env:
          APP_ID: ${{ secrets.SYNC_APP_ID }}
          PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::SYNC_APP_ID and SYNC_APP_PRIVATE_KEY are not set on this repository, so the changelog cannot reach the developer portal. An organisation owner adds the same pair paycross-core already uses."
            exit 1
          fi

      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: paycross
          repositories: api-docs

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compose the portal page
        run: |
          mkdir -p .sync
          python3 .github/scripts/compose-changelog-page.py \
            "Flutter changelog" \
            "Release notes for the paycross_flutter package." \
            paycross-flutter \
            CHANGELOG.md \
            .sync/flutter.md

      - name: Sync files
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.generate-token.outputs.token }}
          COMMIT_PREFIX: "chore: "
          PR_LABELS: automerge
          COMMIT_EACH_FILE: false
