name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can be verified without a Mac, and that is most of it. The
  # Gradle step below actually type-checks the Android half of the Pigeon
  # contract; nothing on Linux can do the same for Swift, which is the whole
  # reason the macOS job exists at all.
  linux:
    name: Analyze, test, Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test pigeons example/lib

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The classic failure of a codegen bridge: someone edits the schema, does
      # not regenerate, and the mismatch only surfaces on a device. Regenerating
      # and diffing costs seconds and closes it.
      - name: Pigeon output is current
        run: |
          set -euo pipefail
          dart run pigeon --input pigeons/paycross_api.dart
          if ! git diff --exit-code -- lib/src/generated android/src/main/kotlin/com/paycross/flutter/generated ios/Classes/generated; then
            echo "::error::Pigeon output is stale. Run: dart run pigeon --input pigeons/paycross_api.dart"
            exit 1
          fi

      - name: Test
        run: flutter test

      # Compiles the generated Kotlin against the hand-written plugin and the
      # real SDK. This is the Android half of the contract check, and the only
      # step here that needs the SDK to exist as a resolvable artifact.
      #
      # Skipped rather than failed while com.pay-cross:paycross-android is
      # unpublished: a red build that means "not released yet" trains people to
      # ignore red builds. Delete this guard once the SDK is on Maven Central,
      # which is already in the example's repository list.
      - name: Is the SDK published?
        id: sdk
        run: |
          set -uo pipefail
          URL=https://repo1.maven.org/maven2/com/pay-cross/paycross-android/0.2.0/paycross-android-0.2.0.pom
          if curl -sfI "$URL" >/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::com.pay-cross:paycross-android:0.2.0 is not on Maven Central yet, so the example APK cannot be built here. Everything else in this job still gates."
          fi

      - name: Build example APK
        if: steps.sdk.outputs.available == 'true'
        run: flutter build apk --debug
        working-directory: example

  # Guards properties that fail silently rather than at build time.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pigeon's own docs advise against putting generated code in a public API,
      # and merchants have no resolver to shield them from a renamed field.
      - name: Generated code is not exported
        run: |
          set -euo pipefail
          # Anchored to a real export/import: the file's own doc comment
          # explains this rule and must not trip it.
          if grep -nE "^\s*(export|import) .*src/generated" lib/paycross_flutter.dart; then
            echo "::error::lib/src/generated must not be exported from the public library"
            exit 1
          fi
          echo "ok"

      # Both native sides must be generated by the same Pigeon, so the version
      # cannot float.
      - name: Pigeon is pinned exactly
        run: |
          set -euo pipefail
          if ! grep -qE '^  pigeon: [0-9]+\.[0-9]+\.[0-9]+$' pubspec.yaml; then
            echo "::error::pigeon must be pinned to an exact version, with no caret"
            exit 1
          fi
          echo "ok"

      # mavenLocal only exists on the machine that published to it. Shipping it
      # would resolve here and fail in every merchant's build.
      - name: No mavenLocal reaches a merchant
        run: |
          set -euo pipefail
          if grep -rn "mavenLocal" android/build.gradle.kts; then
            echo "::error::the plugin's own Gradle config must not depend on mavenLocal"
            exit 1
          fi
          echo "ok"

  # macOS only proves the thing Linux cannot: that the generated Swift and the
  # hand-written iOS implementation actually agree. PR-only, because that
  # mismatch can only be introduced by a source change, and macOS minutes bill
  # at ~10x Linux on a private repo.
  ios:
    name: iOS build
    runs-on: macos-26
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build example for simulator
        run: flutter build ios --simulator --no-codesign
        working-directory: example
