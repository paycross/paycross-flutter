name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Analyze, test, Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned, not `channel: stable`: the format check depends on Dart's exact output.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - run: flutter pub get

      # pub get adds an analyzer.exclude block to these files; they are committed with it.
      - name: analysis_options survives pub get
        run: git diff --exit-code -- analysis_options.yaml example/analysis_options.yaml

      # Pigeon's raw output is not dart format clean, so generated Dart is formatted too.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test pigeons example/lib example/test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Pigeon output is current
        run: |
          set -euo pipefail
          dart run pigeon --input pigeons/paycross_api.dart
          # The committed Dart is formatted, so compare formatted output.
          dart format lib/src/generated
          # Staged so that a new generated file also shows in the diff.
          git add -A lib/src/generated android/src/main/kotlin/com/paycross/flutter/generated ios/paycross_flutter/Sources/paycross_flutter/generated
          if ! git diff --cached --exit-code -- lib/src/generated android/src/main/kotlin/com/paycross/flutter/generated ios/paycross_flutter/Sources/paycross_flutter/generated; then
            echo "::error::Pigeon output is stale. Run: dart run pigeon --input pigeons/paycross_api.dart && dart format lib/src/generated"
            exit 1
          fi

      - name: Test
        run: flutter test

      # flutter test at the root does not descend into example/.
      - name: Test example
        run: flutter test
        working-directory: example

      # Compiles the generated Kotlin against the real SDK artifact.
      - name: Build example APK
        run: flutter build apk --debug
        working-directory: example

  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Generated code stays private: a renamed field would break merchant builds.
      - name: Generated code is not exported
        run: |
          set -euo pipefail
          # Anchored so the library's own doc comment does not match.
          if grep -nE "^\s*(export|import) .*src/generated" lib/paycross_flutter.dart; then
            echo "::error::lib/src/generated must not be exported from the public library"
            exit 1
          fi
          echo "ok"

      # Both native sides must come from the same Pigeon version.
      - name: Pigeon is pinned exactly
        run: |
          set -euo pipefail
          if ! grep -qE '^  pigeon: [0-9]+\.[0-9]+\.[0-9]+$' pubspec.yaml; then
            echo "::error::pigeon must be pinned to an exact version, with no caret"
            exit 1
          fi
          echo "ok"

      # mavenLocal exists only on the machine that published to it.
      - name: No mavenLocal reaches a merchant
        run: |
          set -euo pipefail
          if grep -rn "mavenLocal" android/build.gradle.kts; then
            echo "::error::the plugin's own Gradle config must not depend on mavenLocal"
            exit 1
          fi
          echo "ok"

  # Device-free: every driver call is faked.
  e2e-unit:
    name: Runner and release-tool unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to 3.10, the interpreter the runner must support.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install runner dependencies
        run: pip install -r tool/e2e/requirements.txt -r tool/e2e/requirements-dev.txt

      - name: Lint the runner
        run: |
          ruff check --config tool/e2e/ruff.toml tool/e2e
          ruff format --check --config tool/e2e/ruff.toml tool/e2e

      # Own config: tool/demo targets Python 3.9, not the runner's py310.
      - name: Lint the release tool
        run: |
          ruff check --config tool/demo/ruff.toml tool/demo
          ruff format --check --config tool/demo/ruff.toml tool/demo

      - name: Test the runner
        run: python -m pytest tool/e2e/tests tool/demo/tests -q

  ios:
    name: iOS build
    runs-on: macos-26
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same Flutter floor as the Linux job.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - run: flutter pub get

      # Resolves the SDK from CocoaPods trunk, as merchants do.
      - name: Build example for simulator
        run: flutter build ios --simulator --no-codesign
        working-directory: example
