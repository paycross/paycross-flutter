name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that can be verified without a Mac, and that is most of it. The
  # Gradle step below actually type-checks the Android half of the Pigeon
  # contract; nothing on Linux can do the same for Swift, which is the whole
  # reason the macOS job exists at all.
  linux:
    name: Analyze, test, Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned, not `channel: stable`: the freshness check below diffs
      # `dart format` output, so a floating formatter would break a clean tree
      # the day Dart changes its formatting. 3.44.2 is the pubspec floor.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - run: flutter pub get

      # flutter pub get rewrites both analysis_options.yaml files, adding an
      # analyzer.exclude block. They are committed in exactly that shape, so
      # this stays silent — and shouts if anyone hand-edits them back.
      - name: analysis_options survives pub get
        run: git diff --exit-code -- analysis_options.yaml example/analysis_options.yaml

      # lib/src/generated is included. It used to be excluded so it could stay
      # byte-identical to Pigeon's raw output, but Pigeon does not emit
      # `dart format`-clean Dart and pana scores the whole package's
      # formatting. The freshness check below closes the gap by formatting
      # immediately after generating, so "generated" and "formatted" are one
      # state rather than two competing ones.
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test pigeons example/lib example/test

      - name: Analyze
        run: flutter analyze --fatal-infos

      # The classic failure of a codegen bridge: someone edits the schema, does
      # not regenerate, and the mismatch only surfaces on a device. Regenerating
      # and diffing costs seconds and closes it.
      - name: Pigeon output is current
        run: |
          set -euo pipefail
          dart run pigeon --input pigeons/paycross_api.dart
          # Part of generating, not a separate tidy-up: the committed Dart is
          # formatted, so the comparison has to be against formatted output or
          # this step fails on every clean tree. Kotlin and Swift are left as
          # Pigeon emits them — `dart format` cannot read them, and pana only
          # scores Dart.
          dart format lib/src/generated
          # Staged first, then compared --cached: a plain `git diff` only sees
          # files git already tracks, so output landing in a NEW file — a
          # renamed class, a generator that starts splitting its output — would
          # sit there untracked and the check would pass.
          git add -A lib/src/generated android/src/main/kotlin/com/paycross/flutter/generated ios/Classes/generated
          if ! git diff --cached --exit-code -- lib/src/generated android/src/main/kotlin/com/paycross/flutter/generated ios/Classes/generated; then
            echo "::error::Pigeon output is stale. Run: dart run pigeon --input pigeons/paycross_api.dart && dart format lib/src/generated"
            exit 1
          fi

      - name: Test
        run: flutter test

      # A separate step because `flutter test` at the root does not descend
      # into example/. Without this the E2E label contract is only analyzed,
      # never executed, so a wrong-but-compiling label would ship green.
      - name: Test example
        run: flutter test
        working-directory: example

      # Compiles the generated Kotlin against the hand-written plugin and the
      # real SDK. This is the Android half of the contract check, and the only
      # step here that needs the SDK to exist as a resolvable artifact.
      - name: Build example APK
        run: flutter build apk --debug
        working-directory: example

  # Guards properties that fail silently rather than at build time.
  invariants:
    name: Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pigeon's own docs advise against putting generated code in a public API,
      # and merchants have no resolver to shield them from a renamed field.
      - name: Generated code is not exported
        run: |
          set -euo pipefail
          # Anchored to a real export/import: the file's own doc comment
          # explains this rule and must not trip it.
          if grep -nE "^\s*(export|import) .*src/generated" lib/paycross_flutter.dart; then
            echo "::error::lib/src/generated must not be exported from the public library"
            exit 1
          fi
          echo "ok"

      # Both native sides must be generated by the same Pigeon, so the version
      # cannot float.
      - name: Pigeon is pinned exactly
        run: |
          set -euo pipefail
          if ! grep -qE '^  pigeon: [0-9]+\.[0-9]+\.[0-9]+$' pubspec.yaml; then
            echo "::error::pigeon must be pinned to an exact version, with no caret"
            exit 1
          fi
          echo "ok"

      # mavenLocal only exists on the machine that published to it. Shipping it
      # would resolve here and fail in every merchant's build.
      - name: No mavenLocal reaches a merchant
        run: |
          set -euo pipefail
          if grep -rn "mavenLocal" android/build.gradle.kts; then
            echo "::error::the plugin's own Gradle config must not depend on mavenLocal"
            exit 1
          fi
          echo "ok"

  # macOS only proves the thing Linux cannot: that the generated Swift and the
  # hand-written iOS implementation actually agree. PR-only, because that
  # mismatch can only be introduced by a source change, and macOS minutes bill
  # at ~10x Linux on a private repo.
  ios:
    name: iOS build
    runs-on: macos-26
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # Pinned to the same floor as the Linux job, so both halves of the Pigeon
      # contract are proven against the oldest Flutter the pubspec allows.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true

      - run: flutter pub get

      # Resolves PayCross/PayCrossCore from CocoaPods trunk — the exact
      # artifacts merchants get.
      - name: Build example for simulator
        run: flutter build ios --simulator --no-codesign
        working-directory: example
