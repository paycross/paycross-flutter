name: Publish to pub.dev

# The tag must equal `version:` in pubspec.yaml, or pub.dev rejects the upload.
# Publishing authenticates with GitHub OIDC, so no token secret is stored.
# pub sends the token on version listing too, so it is added only before the upload.
# pub.dev trusts this repository's GitHub Actions identity (tag pattern v{{version}}, environment pub.dev).
# The pub.dev environment's required reviewer is the approval gate: the run waits until an admin approves it.
# An unaccepted token fails resolution as "depends on <package> <version> which doesn't match any versions", an error that never mentions auth.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    name: Publish to pub.dev
    environment: pub.dev
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # The Flutter SDK's dart below shadows this one; both read the same token store.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d

      # The Flutter SDK's dart is the one that can resolve this package.
      - uses: flutter-actions/setup-flutter@80479eab6de1d7909df79ed6aea93aa7f7e8e859

      - name: Unregister the token while resolving
        run: dart pub token remove https://pub.dev

      - name: Install dependencies
        run: dart pub get

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Register the token for the upload
        run: dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Publish to pub.dev
        run: dart pub publish -f
