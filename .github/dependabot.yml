version: 2
updates:
- package-ecosystem: pub
  directory: /
  schedule:
    interval: weekly
  groups:
    pub-deps:
      patterns:
      - '*'
    pub-security:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    github-actions-deps:
      patterns:
      - '*'
    github-actions-security:
      applies-to: security-updates
      patterns:
      - '*'