name: paycross_flutter
description: "PayCross payment SDK for Flutter: card payments, 3-D Secure v2, saved cards, Google Pay on Android and Apple Pay on iOS, wrapping the native Android and iOS SDKs."
version: 0.8.0
homepage: https://github.com/paycross/paycross-flutter
repository: https://github.com/paycross/paycross-flutter
issue_tracker: https://github.com/paycross/paycross-flutter/issues
# pub.dev topics must start with a letter.
topics:
  - payments
  - checkout
  - three-ds

environment:
  sdk: ^3.12.2
  # Flutter 3.44.2 is the oldest release that ships Dart 3.12.2.
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter
  # Pigeon's generated Dart imports meta directly.
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.paycross.flutter
        pluginClass: PayCrossPlugin
      ios:
        pluginClass: PayCrossPlugin
